AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Documenso CI/CD — Two CodePipelines (Staging + Production)
  with CodeBuild and CodeDeploy to EC2, no Docker.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub repository owner
  GitHubRepo:
    Type: String
    Description: GitHub repository name
  GitHubConnectionArn:
    Type: String
    Description: ARN of the CodeStar Connection to GitHub
  StagingInstanceTag:
    Type: String
    Default: documenso-staging
    Description: EC2 tag value for staging instance
  ProductionInstanceTag:
    Type: String
    Default: documenso-production
    Description: EC2 tag value for production instance
  ArtifactBucket:
    Type: String
    Description: S3 bucket for pipeline artifacts
  ApprovalEmail:
    Type: String
    Description: Email address for production deployment approval notifications
    Default: ''
  StagingAppSecretArn:
    Type: String
    Description: Full ARN of the Secrets Manager secret for staging app config
  ProductionAppSecretArn:
    Type: String
    Description: Full ARN of the Secrets Manager secret for production app config
  StagingRdsSecretArn:
    Type: String
    Description: ARN of the AWS-managed RDS secret for staging
  ProductionRdsSecretArn:
    Type: String
    Description: ARN of the AWS-managed RDS secret for production

  # CloudFront parameters
  StagingCertificateArn:
    Type: String
    Description: ACM certificate ARN for the staging CloudFront distribution (must be in us-east-1)
  ProductionCertificateArn:
    Type: String
    Description: ACM certificate ARN for the production CloudFront distribution (must be in us-east-1)
  StagingOriginDomain:
    Type: String
    Description: Domain or public IP of the staging EC2 instance (e.g. ec2-1-2-3-4.eu-central-1.compute.amazonaws.com)
  ProductionOriginDomain:
    Type: String
    Description: Domain or public IP of the production EC2 instance
  StagingDomainAlias:
    Type: String
    Description: Custom domain alias for staging CloudFront (e.g. staging.sign.example.com)
    Default: ''
  ProductionDomainAlias:
    Type: String
    Description: Custom domain alias for production CloudFront (e.g. sign.example.com)
    Default: ''

Conditions:
  HasApprovalEmail: !Not [!Equals [!Ref ApprovalEmail, '']]
  HasStagingAlias: !Not [!Equals [!Ref StagingDomainAlias, '']]
  HasProductionAlias: !Not [!Equals [!Ref ProductionDomainAlias, '']]

Resources:
  # ============================================================
  # IAM Roles
  # ============================================================

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: documenso-codebuild-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}'
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: documenso-codepipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}'
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !GetAtt DocumensoCodeBuild.Arn
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:documenso'
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:documenso/*'
                  - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*'
              - Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ProductionApprovalTopic

  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: documenso-codedeploy-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole

  # ============================================================
  # EC2 Instance Role + Profile
  # ============================================================

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: documenso-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Required for CodeDeploy agent on EC2
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforAWSCodeDeploy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref StagingAppSecretArn
                  - !Ref ProductionAppSecretArn
                  - !Ref StagingRdsSecretArn
                  - !Ref ProductionRdsSecretArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
        - PolicyName: S3ArtifactAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}'
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: documenso-ec2-profile
      Roles:
        - !Ref EC2InstanceRole

  # ============================================================
  # CodeBuild Project (shared by both pipelines)
  # ============================================================

  DocumensoCodeBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: documenso-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 15
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
      Artifacts:
        Type: CODEPIPELINE

  # ============================================================
  # CodeDeploy Application + Deployment Groups
  # ============================================================

  DocumensoCodeDeployApp:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: documenso
      ComputePlatform: Server

  StagingDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref DocumensoCodeDeployApp
      DeploymentGroupName: documenso-staging
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: CodeDeployDefault.AllAtOnce
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
      DeploymentStyle:
        DeploymentOption: WITHOUT_TRAFFIC_CONTROL
        DeploymentType: IN_PLACE
      Ec2TagFilters:
        - Key: app
          Value: !Ref StagingInstanceTag
          Type: KEY_AND_VALUE

  ProductionDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref DocumensoCodeDeployApp
      DeploymentGroupName: documenso-production
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: CodeDeployDefault.AllAtOnce
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
      DeploymentStyle:
        DeploymentOption: WITHOUT_TRAFFIC_CONTROL
        DeploymentType: IN_PLACE
      Ec2TagFilters:
        - Key: app
          Value: !Ref ProductionInstanceTag
          Type: KEY_AND_VALUE

  # ============================================================
  # SNS Topic for Production Approval
  # ============================================================

  ProductionApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: documenso-production-approval

  ProductionApprovalSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasApprovalEmail
    Properties:
      TopicArn: !Ref ProductionApprovalTopic
      Protocol: email
      Endpoint: !Ref ApprovalEmail

  # ============================================================
  # Staging Pipeline (vdd-main → auto deploy)
  # ============================================================

  StagingPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: documenso-staging
      PipelineType: V2
      ExecutionMode: QUEUED
      RestartExecutionOnUpdate: true
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: vdd-main
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput

        - Name: Build
          Actions:
            - Name: CodeBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref DocumensoCodeBuild
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput

        - Name: Deploy
          Actions:
            - Name: CodeDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: '1'
              Configuration:
                ApplicationName: !Ref DocumensoCodeDeployApp
                DeploymentGroupName: !Ref StagingDeploymentGroup
              InputArtifacts:
                - Name: BuildOutput

  # ============================================================
  # Production Pipeline (vdd-production → manual approval → deploy)
  # ============================================================

  ProductionPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: documenso-production
      PipelineType: V2
      ExecutionMode: QUEUED
      RestartExecutionOnUpdate: true
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: vdd-production
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput

        - Name: Build
          Actions:
            - Name: CodeBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref DocumensoCodeBuild
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput

        - Name: Approval
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                NotificationArn: !Ref ProductionApprovalTopic
                CustomData: 'Approve deployment to production?'

        - Name: Deploy
          Actions:
            - Name: CodeDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: '1'
              Configuration:
                ApplicationName: !Ref DocumensoCodeDeployApp
                DeploymentGroupName: !Ref ProductionDeploymentGroup
              InputArtifacts:
                - Name: BuildOutput

  # ============================================================
  # CloudFront Distributions (SSL proxy, no caching)
  # ============================================================

  StagingCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Documenso Staging — SSL proxy (no cache)
        Aliases: !If
          - HasStagingAlias
          - [!Ref StagingDomainAlias]
          - !Ref 'AWS::NoValue'
        ViewerCertificate: !If
          - HasStagingAlias
          - AcmCertificateArn: !Ref StagingCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        HttpVersion: http2and3
        Origins:
          - Id: staging-ec2
            DomainName: !Ref StagingOriginDomain
            CustomOriginConfig:
              HTTPPort: 3000
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: staging-ec2
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer
          Compress: false

  ProductionCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Documenso Production — SSL proxy (no cache)
        Aliases: !If
          - HasProductionAlias
          - [!Ref ProductionDomainAlias]
          - !Ref 'AWS::NoValue'
        ViewerCertificate: !If
          - HasProductionAlias
          - AcmCertificateArn: !Ref ProductionCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        HttpVersion: http2and3
        Origins:
          - Id: production-ec2
            DomainName: !Ref ProductionOriginDomain
            CustomOriginConfig:
              HTTPPort: 3000
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: production-ec2
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer
          Compress: false

Outputs:
  StagingPipelineUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/documenso-staging/view'
  ProductionPipelineUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/documenso-production/view'
  EC2InstanceProfileArn:
    Value: !GetAtt EC2InstanceProfile.Arn
    Description: Attach this instance profile to your staging and production EC2 instances
  StagingCloudFrontDomain:
    Value: !GetAtt StagingCloudFront.DomainName
    Description: Staging CloudFront domain — point your DNS CNAME here
  ProductionCloudFrontDomain:
    Value: !GetAtt ProductionCloudFront.DomainName
    Description: Production CloudFront domain — point your DNS CNAME here
