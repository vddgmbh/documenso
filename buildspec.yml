version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "[Build] Installing dependencies..."
      # NODE_ENV must NOT be production during install — devDependencies
      # contain build tools (turbo, lingui, prisma, typescript, etc.)
      - NODE_ENV=development npm ci

  pre_build:
    commands:
      - echo "[Build] Generating Prisma client..."
      - npx prisma generate --schema=packages/prisma/schema.prisma
      - echo "[Build] Compiling translations..."
      - npx lingui compile

  build:
    commands:
      - echo "[Build] Building Remix app..."
      - NODE_ENV=production npm run build --filter=@documenso/remix
      - echo "[Build] Build complete."

  post_build:
    commands:
      - echo "[Build] Preparing deployment artifact..."
      # Ensure deploy scripts are executable
      - chmod +x scripts/*.sh
      # Remove node_modules — will be reinstalled on EC2
      - rm -rf node_modules
      - rm -rf apps/*/node_modules
      - rm -rf packages/*/node_modules

artifacts:
  files:
    - '**/*'
  base-directory: '.'
  discard-paths: no
