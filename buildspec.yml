version: 0.2

env:
  variables:
    NODE_ENV: 'production'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "[Build] Installing dependencies..."
      - npm ci

  pre_build:
    commands:
      - echo "[Build] Generating Prisma client..."
      - npx prisma generate --schema=packages/prisma/schema.prisma
      - echo "[Build] Compiling translations..."
      - npm run translate:compile

  build:
    commands:
      - echo "[Build] Building Remix app..."
      - npm run build --filter=@documenso/remix
      - echo "[Build] Build complete."

  post_build:
    commands:
      - echo "[Build] Preparing deployment artifact..."
      # Remove node_modules — will be reinstalled on EC2
      - rm -rf node_modules
      - rm -rf apps/*/node_modules
      - rm -rf packages/*/node_modules

artifacts:
  files:
    - '**/*'
  base-directory: '.'
  discard-paths: no
