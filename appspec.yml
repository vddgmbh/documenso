version: 0.0
os: linux

files:
  - source: /
    destination: /opt/documenso

permissions:
  - object: /opt/documenso
    owner: documenso
    group: documenso
    type:
      - directory
      - file

  - object: /opt/documenso/scripts
    owner: documenso
    group: documenso
    mode: '755'

hooks:
  BeforeInstall:
    - location: scripts/clean-target.sh
      timeout: 30
      runas: root

  AfterInstall:
    - location: scripts/fetch-secrets.sh
      timeout: 120
      runas: documenso
    - location: scripts/install-runtime.sh
      timeout: 300
      runas: documenso

  BeforeStart:
    - location: scripts/install-systemd-service.sh
      timeout: 30
      runas: root
    - location: scripts/run-migrations.sh
      timeout: 120
      runas: documenso

  ApplicationStart:
    - location: scripts/restart-service.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/healthcheck.sh
      timeout: 60
      runas: documenso
